version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/store/migrations/control
      - internal/store/migrations/events
    queries: internal/tenancy/queries
    gen:
      go:
        package: queries
        out: internal/tenancy/queries
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
  - engine: postgresql
    schema:
      - internal/store/migrations/control
      - internal/store/migrations/events
      - internal/store/migrations/auth
    queries: internal/services/auth/queries
    gen:
      go:
        package: queries
        out: internal/services/auth/queries
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
  - engine: postgresql
    schema:
      - internal/store/migrations/rtdb
    queries: internal/services/rtdb/queries
    gen:
      go:
        package: queries
        out: internal/services/rtdb/queries
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_files_suffix: .gen
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          # A nil RawMessage is SQL NULL: a leaf's value is NULL on an object's priority row.
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
