name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARUMA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
  ARUMA_TEST_REQUIRE_DB: "1"

jobs:
  go:
    name: Go (lint, unit, acceptance, isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARUMA_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: PostgreSQL 18 client tools (pg_dump must not be older than the server)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
      - name: Lint (gofmt, vet, dependency rules)
        run: make lint
      - name: Generated query code is current
        run: make sqlc-check
      - name: Test
        run: make test
      - name: Build
        run: make build

  smoke:
    name: SDK smoke (web, Admin Node, Admin Go, Android)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            test/smoke/admin-go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/smoke/*/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: test/smoke/android/**/*.gradle.kts
      - name: Smoke tests
        run: test/smoke/run.sh web admin-node admin-go android

  web-auth:
    name: Web Auth e2e (firebase 11, 12, 13)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/e2e/web-auth/package-lock.json
      - name: Official SDK against a real server, no request to Google
        run: test/e2e/web-auth/run.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-auth-report
          path: |
            test/e2e/web-auth/playwright-report
            test/e2e/web-auth/.generated/server.log

  dashboard:
    name: Dashboard (lint, unit, build, e2e in both directions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, Stylelint with logical properties, tsc)
        run: npm run lint
      - name: Unit tests (incl. WCAG contrast and catalog parity)
        run: npm test
      - name: Static export
        run: npm run build
      - run: npx playwright install --with-deps chromium
      # Linux baselines are generated on first run and uploaded for review; existing ones are
      # compared strictly.
      - name: End-to-end, visual and accessibility tests (ar-rtl, en-ltr)
        run: npm run test:e2e -- --update-snapshots=missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-snapshots-linux
          path: dashboard/e2e/__screenshots__
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report
