          name: android-rtdb-logs
          path: |
            test/e2e/android-rtdb/.generated/instrument.txt
            test/e2e/android-rtdb/.generated/logcat.txt
            test/e2e/android-rtdb/.generated/server.log

  android-firestore:
    name: Android Document Database e2e (emulator, Listen and Write streams, network guard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
