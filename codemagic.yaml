# macOS tests that need Xcode and an iOS simulator. Codemagic keeps schedules in its UI, not in
# this file (Team/App settings > Scheduled builds); both workflows also run by hand from the UI.
#   ios-smoke  FirebaseCore/Installations on iOS and Flutter's native initialisation. Nightly.
#   ios-auth   Auth end to end: the official FirebaseAuth in production mode through ArumaRedirect,
#              against a real server, with a network guard (test/e2e/ios-auth). Twice a week.
#   ios-rtdb   Realtime Database end to end: the official FirebaseDatabase in production mode on the
#              generated database URL, under real rules, with a network guard (test/e2e/ios-rtdb).
#              By hand only, not scheduled.
#   ios-storage Cloud Storage end to end, the same two suites as .github/workflows/ios-storage.yml:
#              the Swift one (test/e2e/ios-storage) and the Flutter one
#              (test/e2e/flutter-storage, ios), on the patched FirebaseStorage mirror. By hand only.
# The free tier has 500 macOS minutes a month; max_build_duration caps an ios-auth or ios-rtdb run
# at 30, an ios-storage run at 75 (a run that builds the mirror takes the longest).
workflows:
  ios-smoke:
    name: iOS smoke (nightly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest   # firebase-ios-sdk 13 (pulled by firebase_core 5) needs Swift tools 6.2
      flutter: stable
      node: 24
      vars:
        ARUMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    scripts:
      - name: Go
        script: |
          brew install go
          go version
      - name: PostgreSQL 18
        script: |
          brew install postgresql@18
          PG=$(brew --prefix postgresql@18)/bin
          echo "ARUMA_PG_BIN=$PG" >> $CM_ENV
          $PG/initdb -D "$CM_BUILD_DIR/.pgdata" -U postgres --auth=trust >/dev/null
          $PG/pg_ctl -D "$CM_BUILD_DIR/.pgdata" -l "$CM_BUILD_DIR/pg.log" -o "-p 5432" -w start
      - name: Boot a simulator
        script: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=[x for rt,ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for x in ds if x["name"].startswith("iPhone")]; print(d[0]["udid"])')
          xcrun simctl boot "$UDID" || true
          echo "ARUMA_IOS_SIMULATOR=$UDID" >> $CM_ENV
      - name: Smoke tests
        script: test/smoke/run.sh ios flutter-ios

  ios-auth:
    name: iOS Auth e2e (twice a week)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        ARUMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        HOMEBREW_NO_AUTO_UPDATE: 1
    # Kept 14 days; a twice-weekly schedule keeps it warm. The Swift package checkouts (Firebase and
    # its binary dependencies, about 1.2 GB) are what run.sh would otherwise fetch on every run.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.cache/xcode/spm
        - $HOME/Library/Caches/go-build
        - $HOME/go/pkg/mod
    scripts:
      - name: Go
        script: |
          brew install go
          go version
      - name: PostgreSQL 18
        script: |
          brew install postgresql@18
          PG=$(brew --prefix postgresql@18)/bin
          $PG/initdb -D "$CM_BUILD_DIR/.pgdata" -U postgres --auth=trust >/dev/null
          $PG/pg_ctl -D "$CM_BUILD_DIR/.pgdata" -l "$CM_BUILD_DIR/pg.log" -o "-p 5432" -w start
      - name: iOS Auth e2e
        script: test/e2e/ios-auth/run.sh
    artifacts:
      - test/e2e/ios-auth/.generated/xcodebuild.log
      - test/e2e/ios-auth/.generated/server.log
    # Codemagic emails the build's results to the addresses here. Add the owner's address when
    # connecting the repository (docs/compat/auth-v0.1.md, the guards section).
    # publishing:
    #   email:
    #     recipients:
    #       - owner@example.com
    #     notify:
    #       success: false
    #       failure: true

  ios-rtdb:
    name: iOS Realtime Database e2e (by hand)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        ARUMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        HOMEBREW_NO_AUTO_UPDATE: 1
    # The same Swift package checkouts as ios-auth (FirebaseDatabase comes from the same package).
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.cache/xcode/spm
        - $HOME/Library/Caches/go-build
        - $HOME/go/pkg/mod
    scripts:
      - name: Go
        script: |
          brew install go
          go version
      - name: PostgreSQL 18
        script: |
          brew install postgresql@18
          PG=$(brew --prefix postgresql@18)/bin
          $PG/initdb -D "$CM_BUILD_DIR/.pgdata" -U postgres --auth=trust >/dev/null
          $PG/pg_ctl -D "$CM_BUILD_DIR/.pgdata" -l "$CM_BUILD_DIR/pg.log" -o "-p 5432" -w start
      - name: iOS Realtime Database e2e
        script: test/e2e/ios-rtdb/run.sh
    artifacts:
      - test/e2e/ios-rtdb/.generated/xcodebuild.log
      - test/e2e/ios-rtdb/.generated/server.log
      - test/e2e/ios-rtdb/.generated/sockets.unique.txt

  ios-storage:
    name: iOS Cloud Storage e2e, Swift and Flutter (by hand)
    instance_type: mac_mini_m2
    max_build_duration: 75
    environment:
      xcode: 16.4     # as .github/workflows/ios-storage.yml and the suites' recorded results
      flutter: 3.44.2 # as test/e2e/flutter-storage/app/pubspec.lock was made with
      vars:
        ARUMA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
        HOMEBREW_NO_AUTO_UPDATE: 1
    # The mirror (reproducible, pinned by mirror.lock and checked on every run) and the Swift
    # package checkouts of both apps.
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.cache/mirror
        - $CM_BUILD_DIR/.cache/ios-storage/spm
        - $CM_BUILD_DIR/.cache/flutter-storage/spm
        - $HOME/Library/Caches/go-build
        - $HOME/go/pkg/mod
    # The network guard is each suite's own (LoopbackGuard and FetcherLog in the Swift tests,
    # guard.dart and the e2e plugin's URLProtocol in the Flutter app, lsof samples in both run.sh);
    # test/ci/egress-guard.sh is iptables, Linux only.
    scripts:
      - name: Go
        script: |
          brew install go
          go version
      - name: PostgreSQL 18
        script: |
          brew install postgresql@18
          PG=$(brew --prefix postgresql@18)/bin
          $PG/initdb -D "$CM_BUILD_DIR/.pgdata" -U postgres --auth=trust >/dev/null
          $PG/pg_ctl -D "$CM_BUILD_DIR/.pgdata" -l "$CM_BUILD_DIR/pg.log" -o "-p 5432" -w start
      - name: The mirror (12.19.3)
        script: |
          # One mirror for both suites (its last path component must stay firebase-ios-sdk).
          ARUMA_MIRROR=$CM_BUILD_DIR/.cache/mirror/firebase-ios-sdk.git
          echo "ARUMA_MIRROR=$ARUMA_MIRROR" >> $CM_ENV
          git ls-remote --tags "$ARUMA_MIRROR" refs/tags/12.19.3 2>/dev/null | grep -q . \
            || { git init -q --bare "$ARUMA_MIRROR" && ARUMA_MIRROR_WORK=$CM_BUILD_DIR/.cache/mirror-work sdk/ios/firebase-storage-patch/make-mirror.sh 12.19.3; }
      - name: Swift (test/e2e/ios-storage)
        script: test/e2e/ios-storage/run.sh
      - name: Flutter (test/e2e/flutter-storage ios)
        script: test/e2e/flutter-storage/run.sh ios
    artifacts:
      - test/e2e/ios-storage/.generated/xcodebuild.log
      - test/e2e/ios-storage/.generated/server/server.log
      - test/e2e/flutter-storage/.generated/ios/*.log
      - test/e2e/flutter-storage/.generated/ios/*.txt
      - test/e2e/flutter-storage/.generated/ios/results.json
