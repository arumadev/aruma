# Aruma configuration. Every key can be overridden by an ARUMA_* environment variable
# (e.g. ARUMA_DATABASE_URL). Unknown keys are rejected, so typos fail loudly.

# Required.
database_url: postgres://aruma:secret@127.0.0.1:5432/aruma?sslmode=disable
public_url: https://aruma.example.com
master_key: "<32 random bytes, base64: openssl rand -base64 32>"

# Optional (defaults shown).
listen: ":8080"
metrics_listen: "127.0.0.1:9464"   # "" disables the private metrics listener
log_level: info                    # debug, info, warn, error
signup_open: false                 # let anyone create an account from the console
# project_domain: aruma.example.com  # defaults to the host of public_url
# trusted_proxies: ["10.0.0.0/8"]    # whose X-Forwarded-For is believed, and whose
                                     # X-Forwarded-Proto: https lets Document Database admin
                                     # credentials arrive without TLS (ADR-029)
session:
  idle_timeout: 30m
  absolute_timeout: 8h
mail:
  # dev_mailbox: true              # keep Auth emails of projects without SMTP in the console's dev
                                   # mailbox instead of sending them; defaults to on only when
                                   # public_url is a loopback address (SMTP is set per project)
  # smtp_allow_private: true       # let projects use an SMTP host on a loopback, private or
                                   # link-local address (a local Postfix relay); defaults to on
                                   # only when public_url is a loopback address
rtdb:
  enabled: false                   # Realtime Database; off until v0.2 ships
  # domain: rtdb.example.com       # databases at https://<project>-default-rtdb.<domain>, with a
                                   # wildcard DNS record (ADR-018); unset, ?ns= on public_url
  # dev_open_rules: true           # clients on this machine may read and write every database,
                                   # like Firebase's test mode; accepted only when public_url and
                                   # listen are loopback. Off, only admin and service credentials
                                   # reach the data
  # allowed_origins: []            # hosts whose web pages may connect; empty allows all, as
                                   # Firebase does (credentials travel in messages, not cookies)
  # A proxy in front must keep the Host header, or send X-Forwarded-Host and be listed in
  # trusted_proxies: the database is named by its host, and clients reconnect to that host.
  limits:
    message_bytes: 16777216        # one WebSocket message, so one SDK write
    unauthenticated_message_bytes: 1048576  # one message before the connection signs in
    inflight_bytes: 536870912      # partly received messages, all connections together
    rest_write_bytes: 16777216     # one REST write (Firebase allows 256 MB)
    string_bytes: 10485760         # one string value
    write_bytes_per_minute: 67108864
    connections_per_project: 10000 # counted once a connection signs in or is first allowed
    connections_per_ip: 500        # counted from the handshake
    outbox_bytes: 67108864         # unsent data per connection before it is dropped
    read_rows: 1000000             # stored rows one read may load (a get, a listen's first
                                   # data); more is refused with too_big before loading
rules:                             # Firestore and Storage security rules (ADR-021)
  limits:
    # Firebase's limits: a value may lower one; a value above Firebase's is refused at startup.
    call_depth: 20                 # the longest chain of function calls
    function_lets: 10              # let bindings in one function
    function_args: 7               # parameters of one function
    expression_depth: 98           # the deepest nesting of parentheses, operators, lists, ?:
    match_depth: 10                # nested match blocks
    match_segments: 100            # path segments of nested match blocks together
    match_variables: 20            # path variables of nested match blocks together
    source_bytes: 262144           # the size of a rules file
    expressions: 1000              # expressions evaluated for one request
    lookups_per_operation: 10      # documents one Firestore operation reads (get, exists)
    lookups_per_request: 20        # documents a Firestore batch or transaction reads
    storage_lookups: 2             # Firestore documents one Storage request reads
    rulesets_per_project: 2500     # the rulesets one project keeps
    # Aruma's limits: they protect the server from hostile rules, and may be set freely.
    member_chain: 2000             # a chain of .field and [index]
    work: 67108864                 # work units of one evaluation (patterns, collections)
    value_bytes: 2097152           # one string or bytes value
    value_elements: 1048576        # one list, map or set
    alloc_bytes: 16777216          # the values one evaluation builds
    inflight_bytes: 536870912      # the values every evaluation builds together; past it,
                                   # requests get UNAVAILABLE, which the SDKs retry
    regex_instructions: 10000      # the compiled program of one pattern
    request_segments: 1024         # the segments of a request path
    regex_cache_entries: 256       # patterns built during evaluation that a ruleset keeps
    regex_cache_bytes: 4194304     # their estimated programs
    regex_bytes: 4194304           # the estimated programs of one ruleset's literal patterns
    compiled_rulesets_bytes: 134217728  # compiled rulesets kept in memory, by weight; one
                                   # ruleset may weigh a quarter of it
storage:                           # Cloud Storage for Firebase (ADR-022); see docs/reference/configuration.md
  enabled: false                   # off by default
  # data_dir: /srv/aruma/storage   # required when enabled: an absolute path on a local disk,
                                   # mounted before Aruma starts; back it up with the database
  gc_grace: 1m                     # an unreferenced file waits this long before it is deleted
  limits:
    object_bytes: 5368709120       # one object (at most 5 TiB and at most project_bytes)
    project_bytes: 5368709120      # a project's quota, unfinished uploads included; 0 is unlimited
    min_free_bytes: 2147483648     # disk space no write may take
    empty_session_ttl: 10m         # an upload session that received no byte
    upload_idle_ttl: 1h            # without progress, its unused reservation is freed
    upload_session_ttl: 168h       # an upload session's life
    console_session_ttl: 1h        # an upload session the dashboard issues
    anonymous_staged_fraction: 0.2 # the share of project_bytes anonymous uploads may hold
    metadata_bytes: 8192           # custom metadata, keys and values together
    json_body_bytes: 65536         # a metadata update or upload start body (at most 1 MiB)
    header_field_bytes: 1024       # contentType, cacheControl and the other header fields
    upload_sessions_per_project: 1000
    upload_sessions_per_user: 50
    upload_sessions_per_ip: 100
    upload_starts_per_minute_per_ip: 60
    upload_starts_per_second: 1000 # in the whole server
    upload_requests_per_ip: 64     # concurrent upload and write requests
    min_bytes_per_second: 4096     # slower over 30 seconds, an upload is cut
    list_max_results: 1000         # the largest page of a listing (at most 1000)
documents:                         # Document Database (ADR-024 to ADR-029); see docs/reference/configuration.md
  enabled: false                   # Firestore-compatible: gRPC (h2c or TLS) and REST on this port
  # dev_open_rules: true           # let clients on this machine read and write every database
                                   # without admin credentials until security rules arrive;
                                   # accepted only when public_url and listen are loopback
  # dev_owner_token: true          # accept the emulators' "Bearer owner" from this machine as an
                                   # admin of every project; accepted only when public_url and
                                   # listen are loopback. Off, owner is always refused
  index_enforcement: enforce       # enforce: refuse a query that needs a composite index, as
                                   # production does; warn: serve it and log the index; off:
                                   # serve every query, as the emulator does
  limits:
    message_bytes: 17825792        # one gRPC message or REST body (17 MiB)
    stream_first_message: 10s      # until a stream's first message and credential
    stream_idle: 5m                # a listen stream without a target, or a write stream that
                                   # sent no request, then UNAVAILABLE
    stream_write_stall: 30s        # a streamed answer waiting on a client that stopped reading
    server_stream_max: 5m          # a streamed answer without a client deadline
    streams_per_ip: 500            # streams open at once from one client address
    streams_per_project: 10000     # listen and write streams open at once on one project
    stream_outbox_bytes: 67108864  # unsent on one listen stream (64 MiB); left full, the stream
                                   # ends RESOURCE_EXHAUSTED
    targets_per_stream: 1000       # targets of one listen stream; past it, the target is removed
    snapshot_rows: 1000000         # documents one listen target's read goes through
    stream_lag_events: 4096        # events a listen stream may fall behind, then its targets reset
    commit_concurrency: 4          # commits of one database in Postgres at once
    txn_wait_timeout: 20s          # a wait for a transaction's lock, then ABORTED
    txn_max_lifetime: 270s         # a transaction ends this long after it began
    max_open_txns: 1000            # open locking transactions per database
    max_open_unlocked_txns: 10000  # open read-only and optimistic transactions per database
    max_open_txns_per_user: 100    # of those, one end user's
    max_ended_txns: 100000         # ended transactions remembered for their ids' answers
    max_locks_per_txn: 10000       # documents and listings one transaction locks or reads
    composite_indexes: 1000        # composite indexes per database
    field_overrides: 1000          # field overrides per database, its default aside
    ttl_sweep_interval: 1h         # how often documents past their TTL policy's time are deleted
    ttl_sweep_batch: 500           # due documents read of a database at once (100 batches a pass)
