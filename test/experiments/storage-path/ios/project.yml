# XcodeGen spec of StoragePath.xcodeproj (generated by ../ios.sh, not committed).
#
# S0-B: the official FirebaseStorage (12.19.2) in an XCTest bundle hosted by an empty app, with
# ArumaRedirect (and its storage spike) installed from the tests, one test per mode. The tests also
# drive GTMSessionUploadFetcher directly with a background session, which FirebaseStorage itself
# only uses for putFile on a device.
name: StoragePath
options:
  bundleIdPrefix: com.aruma
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
  GTMSessionFetcher:
    url: https://github.com/google/gtm-session-fetcher.git
    exactVersion: 5.3.1
  ArumaRedirect:
    path: ../../../../sdk/ios/ArumaRedirect
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StoragePathHost:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aruma.s0path
        GENERATE_INFOPLIST_FILE: NO
  StoragePathTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: StoragePathHost
      - package: Firebase
        product: FirebaseStorage
      - package: GTMSessionFetcher
        product: GTMSessionFetcherCore
      - package: ArumaRedirect
        product: ArumaRedirect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aruma.s0path.tests
schemes:
  StoragePath:
    build:
      targets:
        StoragePathHost: all
        StoragePathTests: [test]
    test:
      targets: [StoragePathTests]
      gatherCoverageData: false
