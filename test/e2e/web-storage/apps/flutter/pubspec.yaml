name: aruma_e2e_web_storage
description: measure.sh's Flutter web app, on firebase_auth and firebase_storage in production mode.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_storage: 14.0.1
  http: ^1.6.0
  web: ^1.1.0

# firebase_core 5.1.0 accepts any firebase_core_web ^4.1.0, and each one loads one Firebase JS SDK
# version (4.1.0: 13.1.0, 4.2.0: 13.3.0). measure.sh runs against the firebase npm package it pins,
# so the version is pinned here to the one that matches; raise both together.
dependency_overrides:
  firebase_core_web: 4.1.0
