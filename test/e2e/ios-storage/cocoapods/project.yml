# XcodeGen spec of StorageE2EPods.xcodeproj (generated by ../cocoapods.sh, not committed), the
# CocoaPods variant of ../project.yml: the same host app and the same tests, with FirebaseStorage
# from the last release published to CocoaPods (12.19.0), patched in post_install by
# sdk/ios/ArumaRedirect/Scripts/aruma_storage.rb (see Podfile).
name: StorageE2EPods
options:
  bundleIdPrefix: com.aruma
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set by cocoapods.sh: the Aruma server, written into the app's Info.plist as ArumaURL.
    ARUMA_URL: ""
targets:
  StorageE2EHost:
    type: application
    platform: iOS
    sources:
      - path: ../App
        excludes: [Info.plist]
      - path: ../.generated/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ../App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aruma.smoke
        GENERATE_INFOPLIST_FILE: NO
  StorageE2ETests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests]
    dependencies:
      - target: StorageE2EHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aruma.smoke.tests
schemes:
  StorageE2E:
    build:
      targets:
        StorageE2EHost: all
        StorageE2ETests: [test]
    test:
      targets: [StorageE2ETests]
      gatherCoverageData: false
